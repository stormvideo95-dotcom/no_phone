name: Build and publish No Phone image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "package.json"
      - "index.html"
      - "src/**"
      - "stormvideo-no-phone/icon.svg"
      - "stormvideo-no-phone/umbrel-app.yml"
      - "stormvideo-no-phone/docker-compose.yml"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stormvideo95-dotcom/no-phone:1.0.0
            ghcr.io/stormvideo95-dotcom/no-phone:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/stormvideo95-dotcom/no_phone
            org.opencontainers.image.description=No Phone activity list for Umbrel

      - name: Pin the exact image digest in the Umbrel package
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("stormvideo-no-phone/docker-compose.yml")
          text = path.read_text()
          old = "ghcr.io/stormvideo95-dotcom/no-phone:1.0.0"
          new = old + "@" + os.environ["IMAGE_DIGEST"]
          if old not in text:
              raise SystemExit("Expected image reference was not found in the Umbrel compose file")
          path.write_text(text.replace(old, new))
          PY
          if ! git diff --quiet -- stormvideo-no-phone/docker-compose.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stormvideo-no-phone/docker-compose.yml
            git commit -m "Pin No Phone image digest"
            git push
          fi
