manifestVersion: 1
id: stormvideo-no-phone
storage:
  dataRoot: data
category: Lifestyle
name: No Phone
version: "1.0.0"
tagline: Simple ideas for quality time away from screens
description: >-
  No Phone is a Dutch-language activity list for spending time together away
  from screens. Browse 24 starter ideas, search and filter activities, add
  your own ideas, edit or remove them, and mark moments as completed.

  Your activity list and theme preference are stored in the browser's local
  storage. The app does not need an account, server database, analytics, or
  external API. Browser data is specific to each browser and is not included
  in Umbrel app-data backups.
